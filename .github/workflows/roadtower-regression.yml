name: Roadtower regression checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: HAM GMRS GPS and UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out project code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check repeaters, GPS follow, panels and offline shell
        run: node --test tests/roadtower-regression.test.cjs
